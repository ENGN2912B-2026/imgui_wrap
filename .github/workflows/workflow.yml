name: Build and Test (Ubuntu)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # manually trigger the workflow

permissions:
  checks: write
  actions: read
  contents: read

jobs:

  build-ubuntu:
    name: Ubuntu-Build (GLFW_GL3)
    runs-on: ubuntu-24.04
    steps:

    - name: Checkout source code
      uses: actions/checkout@v5.0.0

    - name: Install Linux Dependencies
      run: |
        sudo apt update
        sudo apt install  \
          libxrandr-dev   \
          libxinerama-dev \
          libxcursor-dev  \
          libxi-dev       \
          libgl-dev

    - name: Configure and Build
      run: ${{github.workspace}}/build.sh

  build-tests-ubuntu:
    name: Ubuntu-Build (Tests)
    runs-on: ubuntu-24.04

    env:
      PRESET_NAME: gcc-linux-release
      # ubuntu-24-04 default GCC is version 13 which does not support C++23 very well
      # we override the compiler for Cmake to GCC 14 for now
      CMAKE_CONFIG_OPTIONS: -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DUSE_GLFW_GL3=0 -DUSE_GUI_TEST_ENGINE=1

    steps:

    - name: Checkout source code
      uses: actions/checkout@v5.0.0

    - name: Configure and Build
      run: |
        cmake --preset ${{ env.PRESET_NAME }} ${{ env.CMAKE_CONFIG_OPTIONS }} && \
        cmake --build --preset "${{ env.PRESET_NAME }}" -j

    - name: Run Tests
      run: |
        export GUI_TEST_MARKDOWN_REPORT_FILE=${{github.workspace}}/gui_test_report.md
        ${{github.workspace}}/build/release/bin/hello_gui
        cat $GUI_TEST_MARKDOWN_REPORT_FILE >> $GITHUB_STEP_SUMMARY
